name: POSVEN3 SQLite dependency lock and desktop validation

on:
  push:
    branches:
      - feat/pos3-sqlite-local-lan
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posven3-sqlite-dependencies
  cancel-in-progress: false

jobs:
  lock-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/pos3-sqlite-local-lan
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate npm lockfile
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo regenerar package-lock.json.' }

      - name: Commit synchronized lockfile
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(sqlite): synchronize native dependency lockfile"
            git push origin HEAD:feat/pos3-sqlite-local-lan
          }

      - name: Install locked dependencies for Electron
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Next.js desktop server
        run: npm run build
        env:
          POSVEN_DESKTOP_BUILD: '1'

      - name: Verify server build output
        shell: pwsh
        run: |
          if (-not (Test-Path '.next/BUILD_ID')) { throw 'No se generó el servidor Next.js de POSVEN3.' }
          if (-not (Test-Path 'node_modules/better-sqlite3/package.json')) { throw 'No se instaló better-sqlite3.' }
          Write-Host 'Servidor local y dependencia SQLite presentes.'

      - name: Build Windows desktop installer
        shell: pwsh
        run: |
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder falló con código $LASTEXITCODE" }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path dist -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $found -or $found.Count -eq 0) { throw 'No se generó ningún instalador .exe.' }
          $found | ForEach-Object { Write-Host "Instalador: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Upload installer validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: POSVEN3-SQLite-LAN-Windows-Validation
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
