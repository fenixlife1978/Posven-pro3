name: Build and publish POSVEN-PRO DEMO

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posven-pro-demo-release
  cancel-in-progress: false

jobs:
  demo-windows:
    name: Build limited DEMO installer
    runs-on: windows-latest
    steps:
      - name: Checkout DEMO branch
        uses: actions/checkout@v4
        with:
          ref: demo-limitada
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Prepare isolated DEMO edition
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.build.appId='com.posven.pro.demo';p.build.productName='PosVEN Pro DEMO';p.build.nsis.shortcutName='PosVEN Pro DEMO';p.build.nsis.uninstallDisplayName='PosVEN Pro DEMO';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          Set-Content -Path DEMO_BUILD -Value 'POSVEN-PRO DEMO - SOLO EVALUACION - DATOS FICTICIOS'
          Write-Host 'Edición DEMO aislada preparada.'

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Next.js server with DEMO limits
        run: npm run build
        env:
          POSVEN_DESKTOP_BUILD: '1'
          POSVEN_DEMO_BUILD: '1'
          NEXT_PUBLIC_POSVEN_DEMO_BUILD: '1'

      - name: Build Windows installer
        shell: pwsh
        run: |
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder falló con código $LASTEXITCODE" }
          $found = Get-ChildItem -Path dist -Filter '*.exe' -File | Select-Object -First 1
          if (-not $found) { throw 'No se generó el instalador DEMO .exe.' }
          Copy-Item $found.FullName 'dist/POSVEN-PRO-DEMO-Setup.exe' -Force
          Write-Host "Instalador DEMO generado: $((Get-Item 'dist/POSVEN-PRO-DEMO-Setup.exe').Length) bytes"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: POSVEN-PRO-DEMO
          path: dist/POSVEN-PRO-DEMO-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release DEMO
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status
          gh release view DEMO --repo fenixlife1978/Posven-pro3 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create DEMO --repo fenixlife1978/Posven-pro3 --target demo-limitada --title "DEMO" --notes "POSVEN-PRO DEMO para evaluación. Incluye datos ficticios y límite de 10 ventas, 10 compras y 10 nuevos ítems. Al agotarse un cupo, la edición queda bloqueada y muestra la invitación a adquirir la versión completa. No usar para operaciones reales."
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear el Release DEMO.' }
          }
          gh release upload DEMO dist/POSVEN-PRO-DEMO-Setup.exe --repo fenixlife1978/Posven-pro3 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo adjuntar el instalador al Release DEMO.' }
