name: Build and publish POSVEN-PRO 2.6.1 installers

on:
  push:
    branches:
      - demo-limitada
    paths:
      - '.github/workflows/demo-release.yml'
      - 'src/lib/demo-limits.ts'
      - 'src/app/api/demo/status/route.ts'
      - 'src/components/demo/DemoNotice.tsx'
      - 'src/app/api/turso/store/route.ts'
      - 'src/lib/turso/schema-init.ts'
      - 'src/app/layout.tsx'
      - 'src/lib/turso/client.ts'
      - 'src/lib/auth/turso-auth.ts'
      - 'main.js'
      - 'next.config.ts'
      - 'package.json'
      - 'src/components/inventory/ProductFormModal.tsx'
      - 'src/components/pos/FractionalProductSelectorModal.tsx'
      - 'src/components/modules/SalesModule.tsx'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: posven-pro-2-6-1-release
  cancel-in-progress: false

jobs:
  windows-installers:
    name: Build complete and DEMO installers
    runs-on: windows-latest
    steps:
      - name: Checkout DEMO source
        uses: actions/checkout@v4
        with:
          ref: demo-limitada
          fetch-depth: 0

      - name: Checkout stable source for full installer
        uses: actions/checkout@v4
        with:
          ref: main
          path: full-source
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build full installer from main without modifying main
        shell: pwsh
        run: |
          Push-Location full-source
          try {
            node -e "const fs=require('fs');const p=require('./package.json');p.version='2.6.1';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci falló para la versión completa ($LASTEXITCODE)" }
            $env:TURSO_MIGRATION_BUILD = '1'
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "Build Next.js completo falló ($LASTEXITCODE)" }
            npx electron-builder --win --publish never
            if ($LASTEXITCODE -ne 0) { throw "electron-builder completo falló ($LASTEXITCODE)" }
            $full = Get-ChildItem -Path dist -Filter '*.exe' -File | Select-Object -First 1
            if (-not $full) { throw 'No se generó el instalador completo .exe.' }
            New-Item -ItemType Directory -Force -Path ../release-assets | Out-Null
            Copy-Item $full.FullName '../release-assets/POSVEN-PRO-Setup-2.6.1.exe' -Force
            Write-Host "Instalador completo: $((Get-Item '../release-assets/POSVEN-PRO-Setup-2.6.1.exe').Length) bytes"
          } finally {
            Pop-Location
          }

      - name: Prepare isolated DEMO edition
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.version='2.6.1';p.build.appId='com.posven.pro.demo';p.build.productName='PosVEN Pro DEMO';p.build.nsis.shortcutName='PosVEN Pro DEMO';p.build.nsis.uninstallDisplayName='PosVEN Pro DEMO';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          Set-Content -Path DEMO_BUILD -Value 'POSVEN-PRO DEMO - SOLO EVALUACION - DATOS FICTICIOS'

      - name: Install DEMO dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Next.js with DEMO limits
        run: npm run build
        env:
          POSVEN_DESKTOP_BUILD: '1'
          POSVEN_DEMO_BUILD: '1'
          NEXT_PUBLIC_POSVEN_DEMO_BUILD: '1'

      - name: Build DEMO installer
        shell: pwsh
        run: |
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder DEMO falló ($LASTEXITCODE)" }
          $found = Get-ChildItem -Path dist -Filter '*.exe' -File | Select-Object -First 1
          if (-not $found) { throw 'No se generó el instalador DEMO .exe.' }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $found.FullName 'release-assets/POSVEN-PRO-DEMO-Setup-2.6.1.exe' -Force
          Write-Host "Instalador DEMO: $((Get-Item 'release-assets/POSVEN-PRO-DEMO-Setup-2.6.1.exe').Length) bytes"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: POSVEN-PRO-2.6.1-Installers
          path: release-assets/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish both installers to GitHub Release v2.6.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth status
          gh release view v2.6.1 --repo fenixlife1978/Posven-pro3 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v2.6.1 --repo fenixlife1978/Posven-pro3 --target main --title "POSVEN-PRO 2.6.1" --notes "Versión 2.6.1. Incluye el instalador completo POSVEN-PRO y el instalador DEMO limitado. El DEMO utiliza datos ficticios y permite hasta 10 ventas, 10 compras y 10 nuevos ítems; al agotar cualquiera de los cupos bloquea la edición de evaluación. El instalador completo se construye desde main sin modificar la rama main."
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear el Release v2.6.1.' }
          }
          gh release upload v2.6.1 release-assets/POSVEN-PRO-Setup-2.6.1.exe release-assets/POSVEN-PRO-DEMO-Setup-2.6.1.exe --repo fenixlife1978/Posven-pro3 --clobber
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron adjuntar ambos instaladores al Release v2.6.1.' }
