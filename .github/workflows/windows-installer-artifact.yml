name: Windows Installer Artifact

on:
  push:
    branches:
      - build/windows-installer-artifact
      - fix/login-backup-unlimited-import

permissions:
  contents: read

concurrency:
  group: posven-pro3-windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild better-sqlite3 for Node tests
        run: npm rebuild better-sqlite3
      - name: Run regression tests
        run: npm test
      - name: Build application
        run: npm run build
      - name: Package Windows installer without publishing
        run: npx electron-builder --publish never
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosVEN-Pro-Windows-x64-installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7
