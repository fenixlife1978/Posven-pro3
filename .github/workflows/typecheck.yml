name: TypeScript validation

on:
  push:
    branches:
      - feature/resumen-salidas-periodicas
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # electron-builder's postinstall prepares better-sqlite3 for Electron.
      # Rebuild this native addon for the Node.js ABI used by node:test.
      - run: npm rebuild better-sqlite3 --build-from-source --runtime=node --target=20.20.2 --dist-url=https://nodejs.org/download/release
      - run: npm test
      - run: npx tsc --noEmit --pretty false
