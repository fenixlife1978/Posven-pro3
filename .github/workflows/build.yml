name: Build Windows EXE installers (SQLite desktop)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
      - turso-migration
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Required to publish the COMPLETE and DEMO installers as release assets.
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Next.js desktop runtime (SQLite local)
        run: npm run build
        env:
          POSVEN_DESKTOP_BUILD: '1'

      - name: Verify Next.js server build
        shell: pwsh
        run: |
          if (-not (Test-Path '.next/BUILD_ID')) {
            throw 'No se generó .next/BUILD_ID; el build local de Next.js no está listo para SQLite.'
          }
          Write-Host 'Build de Next.js verificado para escritorio/SQLite.'

      - name: Build COMPLETE Windows installer
        shell: pwsh
        run: |
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder completo falló con código $LASTEXITCODE" }
          $found = Get-ChildItem -Path dist -Recurse -Filter '*.exe' -File -ErrorAction SilentlyContinue
          if (-not $found -or $found.Count -eq 0) { throw 'No se generó ningún instalador completo .exe.' }
          $found | ForEach-Object { Write-Host "COMPLETO: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build separate DEMO installer
        shell: pwsh
        run: |
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $package.build.productName = 'PosVEN Pro DEMO'
          $package.build.directories.output = 'dist-demo'
          $package | ConvertTo-Json -Depth 100 | Set-Content 'package.json' -Encoding utf8
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder DEMO falló con código $LASTEXITCODE" }
          $demoInstaller = Get-ChildItem -Path 'dist-demo' -Filter '*.exe' -File
          if (-not $demoInstaller -or $demoInstaller.Count -eq 0) { throw 'No se generó el instalador DEMO.' }
          $demoInstaller | ForEach-Object { Write-Host "DEMO: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish installers as downloadable GitHub Release assets
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-desktop]'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-sqlite-${{ github.run_number }}
          name: PosVEN-PRO3 SQLite Desktop - build ${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.exe
            dist-demo/*.exe
          fail_on_unmatched_files: true

      - name: Upload COMPLETE installer as optional Actions artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PosVEN-Pro3-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3

      - name: Upload DEMO installer as optional Actions artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: PosVEN-Pro3-Windows-DEMO
          path: dist-demo/*.exe
          if-no-files-found: error
          retention-days: 3
