name: Build Windows EXE artifacts (no GitHub Release)

on:
  push:
    branches:
      - feat/pos3-sqlite-local-lan
    paths:
      - '.github/workflows/build.yml'
      - 'main.js'
      - 'preload.js'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'tests/**'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - 'main.js'
      - 'preload.js'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: posven3-sqlite-validation-final-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate Electron main process syntax
        run: node --check main.js

      - name: Test local TLS certificate and fingerprint pinning
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'posven3-tls-test'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Import-Module Microsoft.PowerShell.Security -ErrorAction Stop
          if (-not (Get-PSDrive -Name Cert -ErrorAction SilentlyContinue)) { New-PSDrive -Name Cert -PSProvider Certificate -Root '\' -ErrorAction Stop | Out-Null }
          $store = 'Cert:\CurrentUser\My'
          if (-not (Test-Path -LiteralPath $store)) { New-Item -Path $store -Force -ErrorAction Stop | Out-Null }
          if (-not (Test-Path -LiteralPath $store)) { throw 'No se pudo inicializar Cert:\CurrentUser\My.' }
          $pfxPath = Join-Path $dir 'server.pfx'
          $cerPath = Join-Path $dir 'server.cer'
          $cert = New-SelfSignedCertificate -Subject 'CN=POSVEN3-CI' -DnsName @('localhost') -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 2048 -KeyExportPolicy Exportable -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(2)
          $passwordText = [Convert]::ToBase64String([byte[]](1..32 | ForEach-Object { Get-Random -Minimum 0 -Maximum 256 }))
          $password = ConvertTo-SecureString $passwordText -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $password | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath -Type CERT | Out-Null
          $env:POSVEN_TLS_TEST_PASSWORD = $passwordText
          node scripts/test-lan-tls.cjs $pfxPath $cerPath
          if ($LASTEXITCODE -ne 0) { throw 'La prueba TLS de POSVEN3 falló.' }
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force

      - name: Install dependencies from the committed lockfile
        run: npm ci --no-audit --no-fund

      - name: Rebuild SQLite native binding for Node 20 tests
        run: npm rebuild better-sqlite3 --runtime=node --target=20.20.2 --dist-url=https://nodejs.org/download/release

      - name: Run regression tests
        run: npm test

      - name: Build Next.js desktop SQLite server
        run: npm run build
        env:
          POSVEN_DESKTOP_BUILD: '1'

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Verify Next.js server build
        shell: pwsh
        run: |
          if (-not (Test-Path '.next/BUILD_ID')) {
            throw 'No se generó .next/BUILD_ID; el servidor local de POSVEN3 no está listo.'
          }
          Write-Host 'Build de Next.js verificado para el servidor SQLite local.'

      # El servidor Next.js del instalador corre en un UtilityProcess de Electron,
      # que usa un ABI distinto al de Node. Las pruebas de la suite dejan
      # better-sqlite3 compilado para Node 20: si ese binario se empaqueta, la
      # interfaz carga pero todas las rutas API fallan con ERR_DLOPEN_FAILED.
      - name: Rebuild SQLite binding for the Electron ABI
        shell: pwsh
        run: |
          $target = node -p "require('./node_modules/electron/package.json').version"
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($target)) { throw 'No se pudo determinar la versión de Electron.' }
          Write-Host "Recompilando better-sqlite3 para Electron $target"
          npx --no-install @electron/rebuild -f -w better-sqlite3
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'electron-rebuild falló; se compila contra las cabeceras de Electron.'
            Push-Location node_modules\better-sqlite3
            npx --yes node-gyp rebuild --release --target=$target --dist-url=https://electronjs.org/headers --arch=x64
            $gypExit = $LASTEXITCODE
            Pop-Location
            if ($gypExit -ne 0) { throw "node-gyp no pudo compilar better-sqlite3 para Electron (código $gypExit)" }
          }

      - name: Diagnóstico del ABI de SQLite (informativo)
        continue-on-error: true
        run: |
          node -e "require('better-sqlite3');console.log('Atención: el binario sigue siendo el de Node, no el de Electron.')"

      - name: Verify SQLite loads with the Electron ABI
        shell: pwsh
        run: |
          $electron = Join-Path $PWD 'node_modules\electron\dist\electron.exe'
          if (-not (Test-Path $electron)) { throw 'No se encontró el binario de Electron para verificar el ABI.' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $electron -e "require('better-sqlite3'); console.log('better-sqlite3 carga con el ABI de Electron');"
          $code = $LASTEXITCODE
          Remove-Item Env:\ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          if ($code -ne 0) { throw 'better-sqlite3 no carga con el ABI de Electron; el instalador fallaría en todas las rutas API.' }

      - name: Build Windows installer without publishing a Release
        shell: pwsh
        run: |
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder falló con código $LASTEXITCODE" }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path dist -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $found -or $found.Count -eq 0) { throw 'No se generó ningún instalador .exe.' }
          $found | ForEach-Object { Write-Host "Instalador: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Upload Windows installer as a downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosVEN-Pro3-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
