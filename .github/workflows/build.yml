name: Build/Release PosVEN Pro

on:
  # Disparar en CADA push a cualquier branch (no solo main), para que las
  # feature branches también generen artefactos .exe de prueba.
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  # Disparar también cuando se abre/actualiza un PR, para validar el build
  # antes de mergear a main.
  pull_request:
    branches:
      - main
      - master
  # Permite disparar manualmente desde la UI de GitHub.
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Omitir publicación en GitHub Releases (solo artefacto)'
        required: false
        default: 'false'

# Cancela builds en cola cuando hay un push nuevo (ahorra minutos de CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # No fallar toda la matriz si una plataforma falla; sigue intentando
      # las demás para no perder el trabajo.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: PosVEN-Pro-Windows-Installer
            artifact_path: dist/*.exe
            publish_target: nsis
          - os: ubuntu-latest
            artifact_name: PosVEN-Pro-Linux-AppImage
            artifact_path: dist/*.AppImage*
            publish_target: AppImage

    permissions:
      # Necesario para que electron-builder suba artefactos y cree releases
      # en GitHub Releases vía la API de GitHub.
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python (para compilar módulos nativos en Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache electron-builder binaries
        # Acelera builds subsiguientes cacheando los binarios descargados
        # por electron-builder (~150MB la primera vez, después casi gratis).
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libxss1 libasound2t64 fakeroot rpm

      - name: Install dependencies
        run: npm ci
        env:
          # Desactiva la descarga del binario de electron postinstall;
          # electron-builder lo gestionará por su cuenta.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}

      - name: Verify Next.js export
        run: |
          echo "=== Verificando bundle Next.js ==="
          if (Test-Path "out/index.html") {
            Write-Host "✅ out/index.html encontrado"
          } else {
            Write-Host "❌ ERROR: out/index.html NO encontrado"
            exit 1
          }
          # Verificación adicional: que existan los chunks de JS principales
          $chunks = Get-ChildItem -Path "out/_next" -Recurse -Filter "*.js" -ErrorAction SilentlyContinue
          if ($chunks.Count -gt 0) {
            Write-Host "✅ Chunks JS encontrados: $($chunks.Count) archivos"
          } else {
            Write-Host "❌ ERROR: no se encontraron chunks JS en out/_next"
            exit 1
          }
        shell: pwsh

      - name: Build Electron installer
        # Solo publica en GitHub Releases cuando es push a main/master o tag.
        # Para PRs y feature branches, solo sube el .exe como artefacto.
        run: |
          if ("${{ matrix.os }}" -eq "windows-latest") {
            if ("${{ github.event_name }}" -eq "pull_request" -or "${{ github.ref }}" -like "refs/heads/fix/*" -or "${{ github.ref }}" -like "refs/heads/feature/*") {
              Write-Host "ℹ️  PR/feature branch: solo artefacto, no release"
              npx electron-builder --win --publish never
            } else {
              Write-Host "ℹ️  main/master/tag: publicación completa con release"
              npx electron-builder --win --publish always
            }
          } else {
            npx electron-builder --linux --publish never
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          # Evita que electron-builder intente subir a proveedores
          # distintos a GitHub Releases (publish siempre apunta a GitHub).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer exists
        shell: pwsh
        run: |
          echo "=== Verificando instalador generado ==="
          Get-ChildItem -Path dist -Recurse -Include *.exe,*.AppImage,*.yml | ForEach-Object {
            Write-Host "📦 $($_.FullName) ($([math]::Round($_.Length/1MB, 2)) MB)"
          }
          $found = Get-ChildItem -Path dist -Recurse -Include *.exe,*.AppImage -ErrorAction SilentlyContinue
          if (-not $found -or $found.Count -eq 0) {
            Write-Host "❌ ERROR: no se generó ningún instalador"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload blockmap (para auto-updates)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-blockmap
          path: |
            dist/*.blockmap
            dist/latest.yml
            dist/latest-linux.yml
          if-no-files-found: ignore
          retention-days: 14
