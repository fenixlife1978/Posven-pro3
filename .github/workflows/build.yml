name: Build Windows EXE (Local SQLite - Demo + Complete)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - turso-migration
  workflow_dispatch:

concurrency:
  group: \${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Demo and Complete Windows installers
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Verify release version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne '2.6.1') { throw "Se esperaba la versión 2.6.1; package.json tiene $version" }
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

      - name: Build Next.js desktop server for local SQLite
        run: npm run build
        env:
          POSVEN_DESKTOP_BUILD: '1'

      - name: Verify Next.js server build
        shell: pwsh
        run: |
          if (-not (Test-Path '.next/BUILD_ID')) {
            throw 'No se generó .next/BUILD_ID; el build no está listo para ejecutar las API locales de SQLite.'
          }

      - name: Build Demo installer (isolated data + 10 actions per module)
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.build.productName='PosVEN Pro Demo';p.build.appId='com.posven.pro.demo';p.build.extraMetadata={...(p.build.extraMetadata||{}),posvenDemoMode:true};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación del instalador Demo: $LASTEXITCODE" }
          $demo = Get-ChildItem -Path dist -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $demo) { throw 'No se generó el instalador .exe del Demo.' }
          Copy-Item $demo.FullName 'release-artifacts/POSVEN-PRO-DEMO-Setup-2.6.1.exe' -Force

      - name: Build Complete installer (no demo data or limits)
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const p=require('./package.json');p.build.productName='PosVEN Pro';p.build.appId='com.posven.pro';p.build.extraMetadata={...(p.build.extraMetadata||{}),posvenDemoMode:false};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "Falló la compilación del instalador completo: $LASTEXITCODE" }
          $complete = Get-ChildItem -Path dist -Filter '*Setup*.exe' | Where-Object { $_.Name -notlike '*Demo*' } | Select-Object -First 1
          if (-not $complete) { throw 'No se generó el instalador .exe completo.' }
          Copy-Item $complete.FullName 'release-artifacts/POSVEN-PRO-Setup-2.6.1.exe' -Force

      - name: Verify both installers
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release-artifacts -Filter '*.exe'
          if ($files.Count -ne 2) { throw "Se esperaban dos instaladores y se encontraron $($files.Count)." }
          $files | ForEach-Object { Write-Host "$($_.Name) — $([math]::Round($_.Length / 1MB, 2)) MB" }
          if ((Get-Item 'release-artifacts/POSVEN-PRO-DEMO-Setup-2.6.1.exe').Length -lt 1MB) { throw 'El artefacto Demo parece incompleto.' }
          if ((Get-Item 'release-artifacts/POSVEN-PRO-Setup-2.6.1.exe').Length -lt 1MB) { throw 'El artefacto completo parece incompleto.' }

      - name: Upload both installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PosVEN-Pro3-2.6.1-Demo-and-Complete
          path: release-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Update existing v2.6.1 release with verified SQLite-local installers
        if: github.ref == 'refs/heads/sqlite-local-fraccionados' && contains(github.event.head_commit.message, '[publish-v2.6.1]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH repos/fenixlife1978/Posven-pro3/git/refs/tags/v2.6.1 -f sha=$env:GITHUB_SHA -F force=true
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo actualizar el tag v2.6.1 al commit SQLite local.' }
          gh release upload v2.6.1 release-artifacts/POSVEN-PRO-DEMO-Setup-2.6.1.exe release-artifacts/POSVEN-PRO-Setup-2.6.1.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw 'No se pudieron reemplazar los dos instaladores del release v2.6.1.' }
          gh release edit v2.6.1 --title 'POSVEN-PRO 2.6.1 - SQLite local' --notes 'POSVEN-PRO 2.6.1 para Windows. Instalador completo: SQLite local persistente, modo servidor/cliente en red local y aislamiento de datos por caja asignada. Instalador DEMO: datos ficticios aislados, cintillo comercial permanente y máximo de 10 acciones por módulo. Los dos instaladores se reconstruyeron desde el commit SQLite local.'
          if ($LASTEXITCODE -ne 0) { throw 'Los instaladores se subieron, pero no se pudo actualizar la descripción del release.' }

      - name: Publish both installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PosVEN Pro 2.6.1
          body: |
            POSVEN-PRO 2.6.1 para Windows.

            - POSVEN-PRO-Setup-2.6.1.exe: instalador completo con SQLite local.
            - POSVEN-PRO-DEMO-Setup-2.6.1.exe: edición Demo aislada con límite de 10 acciones por módulo.
          files: release-artifacts/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
