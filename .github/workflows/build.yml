name: Build Windows EXE (Turso only)

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - turso-migration
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Next.js for Turso API runtime
        run: npm run build
        env:
          TURSO_MIGRATION_BUILD: '1'

      - name: Verify Next.js server build
        shell: pwsh
        run: |
          if (-not (Test-Path '.next/BUILD_ID')) {
            throw 'No se generó .next/BUILD_ID; el build de Next.js no está listo para ejecutar las API de Turso.'
          }
          Write-Host 'Build de Next.js verificado para Windows/Turso.'

      - name: Build Windows installer
        shell: pwsh
        run: |
          $publish = 'never'
          $isRelease = ($env:GITHUB_REF -like 'refs/tags/v*') -or ($env:GITHUB_REF -eq 'refs/heads/main') -or ($env:GITHUB_REF -eq 'refs/heads/master')
          if ($isRelease -and $env:GITHUB_EVENT_NAME -ne 'pull_request') { $publish = 'always' }
          Write-Host "electron-builder --win --publish $publish"
          npx electron-builder --win --publish $publish
          if ($LASTEXITCODE -ne 0) { throw "electron-builder falló con código $LASTEXITCODE" }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path dist -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $found -or $found.Count -eq 0) { throw 'No se generó ningún instalador .exe.' }
          $found | ForEach-Object { Write-Host "Instalador: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: PosVEN-Pro3-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
