name: Build Windows EXE artifacts (no GitHub Release)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
      - turso-migration
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Next.js desktop runtime (SQLite local)
        run: npm run build
        env:
          POSVEN_DESKTOP_BUILD: '1'

      - name: Verify Next.js server build
        shell: pwsh
        run: |
          if (-not (Test-Path '.next/BUILD_ID')) {
            throw 'No se generó .next/BUILD_ID; el build local de Next.js no está listo para SQLite.'
          }
          Write-Host 'Build de Next.js verificado para escritorio/SQLite.'

      - name: Build Windows installer without publishing a Release
        shell: pwsh
        run: |
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder falló con código $LASTEXITCODE" }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path dist -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $found -or $found.Count -eq 0) { throw 'No se generó ningún instalador .exe.' }
          $found | ForEach-Object { Write-Host "Instalador: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Build separate DEMO installer with ten actions per module
        shell: pwsh
        run: |
          $package = Get-Content 'package.json' -Raw | ConvertFrom-Json
          $package.build.productName = 'PosVEN Pro DEMO'
          $package.build.directories.output = 'dist-demo'
          $package | ConvertTo-Json -Depth 100 | Set-Content 'package.json' -Encoding utf8
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder DEMO falló con código $LASTEXITCODE" }
          $demoInstaller = Get-ChildItem -Path 'dist-demo' -Filter '*.exe' -File
          if (-not $demoInstaller -or $demoInstaller.Count -eq 0) { throw 'No se generó el instalador DEMO.' }
          $demoInstaller | ForEach-Object { Write-Host "DEMO: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload DEMO installer as a downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosVEN-Pro3-Windows-DEMO
          path: dist-demo/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer as a downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosVEN-Pro3-Windows-Installer
          path: dist/PosVEN Pro Setup *.exe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
