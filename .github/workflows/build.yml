name: Build Windows EXE artifacts (no GitHub Release)

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
      - turso-migration
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Build Next.js desktop SQLite server
        run: npm run build
        env:
          POSVEN_DESKTOP_BUILD: '1'

      - name: Verify Next.js server build
        shell: pwsh
        run: |
          if (-not (Test-Path '.next/BUILD_ID')) {
            throw 'No se generó .next/BUILD_ID; el servidor local de POSVEN3 no está listo.'
          }
          Write-Host 'Build de Next.js verificado para el servidor SQLite local.'

      - name: Build Windows installer without publishing a Release
        shell: pwsh
        run: |
          npx electron-builder --win --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder falló con código $LASTEXITCODE" }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer
        shell: pwsh
        run: |
          $found = Get-ChildItem -Path dist -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue
          if (-not $found -or $found.Count -eq 0) { throw 'No se generó ningún instalador .exe.' }
          $found | ForEach-Object { Write-Host "Instalador: $($_.FullName) ($([math]::Round($_.Length / 1MB, 2)) MB)" }

      - name: Upload synchronized npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: POSVEN3-SQLite-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows installer as a downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PosVEN-Pro3-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
